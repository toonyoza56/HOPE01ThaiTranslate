<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HOPE 01 Thai build</title>
<style>
	body { font-family: monospace; background: #111; color: #ddd; padding: 12px; }
	pre { white-space: pre-wrap; }
	.fonts img { image-rendering: pixelated; width: 1024px; background: #333; margin: 4px 0; display: block; }
	button { font: inherit; padding: 4px 10px; }
</style>
</head>
<body>
<h3>HOPE 01 Thai build</h3>
<p>translations/th.csv + work/strings.json + game files → build/www (data.json, scripts/c3main.js, images/thai-font-*.png)</p>
<button id="run">Build</button>
<pre id="log"></pre>
<div class="fonts" id="fonts"></div>
<script src="lib.js"></script>
<script>
/*
 * Thai text in SpriteFont (bitmap) fonts:
 *  1. Word breaks: Thai has no spaces, Construct's word wrap breaks on whitespace and treats
 *     U+200B (zero width space) as whitespace, so U+200B is inserted between Thai words
 *     (Intl.Segmenter) and drawn with width 0.
 *  2. SpriteFont draws one cell per character, so vowels/tone marks above/below would float
 *     in their own cells. Every Thai grapheme cluster with marks (e.g. "ที่", "น้ำ") becomes a
 *     single glyph mapped to a Private Use Area code point (U+E000+).
 *  3. Each patched SpriteFont gets a new sheet: its original English glyphs copied (scaled x2
 *     for the small 7px fonts, drawn at scale 0.5 so English looks unchanged) + Thai glyphs
 *     rendered from a Windows Thai font. Same approach the developers used for their
 *     Japanese test font (16x16 cells at scale 0.5).
 */
const log = s => { document.getElementById("log").textContent += s + "\n"; };

// Leelawadee UI has clearer Thai counters and tone marks than Tahoma at this UI scale.
const THAI_FONT = '"Leelawadee UI", "Tahoma", sans-serif';
const THAI_SIZE = +(new URLSearchParams(location.search).get("size") || 1.6);   // Thai font px per English cap-height px
// Left-aligned boxes with free space on the right that can be widened for longer Thai text.
const WIDEN = {
	MainMenu_Button_NewGame: 1.8, MainMenu_Button_Load: 1.8, MainMenu_Button_Exit: 1.8,
	MainMenu_Button_Settings: 1.8, MainMenu_Button_Discord: 1.8
};
// Stacked boxes the game hit-tests with "mouse is over" (menu buttons 32 apart, dialogue choices
// 16 apart): growing them past that spacing makes them overlap, so two items highlight at once
// and a click can pick the wrong one. Max box height per type (tested in game: no clipping).
const HEIGHT_CAP = {
	MainMenu_Button_NewGame: 24, MainMenu_Button_Load: 24, MainMenu_Button_Exit: 24,
	MainMenu_Button_Settings: 24, MainMenu_Button_Discord: 24,
	ui_dialogue_textframe_choice1: 16, ui_dialogue_textframe_choice2: 16,
	ui_dialogue_textframe_choice3: 16, ui_dialogue_textframe_choice4: 16,
	// not a mouse target, but taller than its 60px frame would only let lines spill over the frame
	ui_dialogue_textframe_text: 62
};
// Boxes given a fixed height instead of the computed growth. Item descriptions: English lines are 7px,
// Thai needs 14 (see FONT_TUNING), so long texts scroll (SCROLL_BOXES); the box is the item panel's
// inner area (y 121..297) and the engine does not draw lines below it, which masks the rest.
const HEIGHT_FIXED = { item_stext_description: 176 };
// Text boxes that scroll (arrow keys / mouse wheel over the box) when the text is taller than the box;
// a pixel scrollbar is drawn over the canvas at barX (layout px). See scrollRuntime().
const SCROLL_BOXES = { item_stext_description: { barX: 620 } };
const LINE_FACTOR =+(new URLSearchParams(location.search).get("line") || 1.35); // line advance vs original char height
// Per-type font overrides (a type listed here gets its own sheet):
//   size   - Thai font px per English cap-height px (instead of THAI_SIZE)
//   line   - line advance as a multiple of the Thai font size (instead of LINE_FACTOR x char height)
//   smooth - keep the anti-aliased edges instead of the 1-bit pixel look
// The dialogue box font is a 5px-cap pixel font: 1-bit Thai at that size was unreadable (tested).
const Q = new URLSearchParams(location.search);
//   bitsy  - draw Thai from a .bitsyfont pixel font instead; px = sheet pixels per font pixel
//            (one game pixel when px x the final instance scale = 1; both boxes below end at
//            scale 1/3 -> px 3), line = line advance in font pixels
// All boxes use the user's Thai_nuttatulipa pixel font, drawn 1 font px = 1 game px (px 3):
//  - It is a hand-drawn 6px-body Thai font. Thai_7x7 / Thai_4x5 (generated by resizing it) broke
//    the letters and are not used. Taller text = `grow` (rows added in straight stems, see loadBitsy).
//  - line must be >= the glyph cell (16 rows + grow): a smaller line hides the next line's marks
//    (tested in game), so there is no "compact" line spacing.
//  - dialogue: body 7 (grow 1), the English dialogue font is 5px caps; 3 lines still fit the frame.
//  - choices: body 6, one line each, boxes 16 apart (HEIGHT_CAP).
//  - item / hint / ending text: body 6, tight marks (14-row cell), line 14 (English line is 7-12:
//    Thai text is taller, and the user accepts a little overflow for readability; see the wrap
//    check in the build log).
const BITSY_FONT = "/fonts/Thai_nuttatulipa.bitsyfont";
const DGROW = +(Q.get("dgrow") ?? 1);
const CHOICE_TUNING = Q.get("cfont") === "smooth" ? null : { bitsy: BITSY_FONT, px: 3, line: 16, moveDown: +(Q.get("cdown") || 0) };
const DIALOGUE_TUNING = Q.get("dfont") === "smooth"
	? { size: +(Q.get("dsize") || 2.0), line: +(Q.get("dline") || 1.32), smooth: Q.get("dsmooth") !== "0" }
	: { bitsy: BITSY_FONT, px: 3, grow: DGROW, line: +(Q.get("dline") || 16 + DGROW), moveDown: +(Q.get("ddown") || 3) };
const TEXT_TUNING = { bitsy: BITSY_FONT, px: 3, tight: 1, line: 14 };
const FONT_TUNING = {
	ui_dialogue_textframe_text: DIALOGUE_TUNING,
	...(Q.get("readable") !== "0" ? {
		item_stext_title: TEXT_TUNING,
		item_stext_description: TEXT_TUNING,
		hint_text: TEXT_TUNING,
		ending_text: TEXT_TUNING
	} : {}),
	...(CHOICE_TUNING ? Object.fromEntries([1, 2, 3, 4].map(k => ["ui_dialogue_textframe_choice" + k, CHOICE_TUNING])) : {})
};const PUA_START = 0xE000;
const ZWSP = "​";
// SpriteFonts that show place names only (kept English) are not patched.
const SKIP_TYPES = new Set(["env_textsign", "env_textsign2", "env_sign_text"]);

const isThai = ch => /[฀-๿]/.test(ch);

async function build() {
	log("loading ...");
	const files = await fetch("/list/translations").then(r => r.json());
	const [data, js, strings, extracted, ...csvs] = await Promise.all([
		fetch("/game/data.json").then(r => r.json()),
		fetch("/game/scripts/c3main.js").then(r => r.text()),
		fetch("/work/strings.json").then(r => r.json()),
		fetch("/work/strings.csv").then(r => r.text()),
		...files.map(f => fetch("/translations/" + encodeURIComponent(f)).then(r => r.text()))
	]);
	const keepTerms = new Map(HM.parseCsv(extracted).map(r => [r.category + "|" + r.english, r.keep_terms || ""]));
	const P = data.project, T = P[3];
	if (T.some(t => Array.isArray(t[6]) && String(t[6][0]).includes("thai-font-")))
		throw new Error("the game folder has the Thai build installed - run tools/uninstall.ps1 first (build needs the original data.json)");
	// All translations/*.csv, in name order (a later file overrides an earlier one).
	const translations = new Map();
	csvs.forEach(csv => { for (const row of HM.parseCsv(csv)) if (row.thai && row.thai.trim()) translations.set(row.category + "|" + row.english, row); });
	log(`translations: ${translations.size} from ${files.join(", ")}`);

	// ---- 1) Thai text -> word breaks -> PUA clusters
	const words = new Intl.Segmenter("th", { granularity: "word" });
	const graphemes = new Intl.Segmenter("th", { granularity: "grapheme" });
	const clusterToChar = new Map(); // "ที่" -> ""
	const thaiSingles = new Set();

	const withBreaks = text => {
		let out = "", prevThai = false;
		for (const { segment } of words.segment(text)) {
			const thai = isThai(segment[0]);
			if (thai && prevThai) out += ZWSP;
			out += segment;
			prevThai = thai;
		}
		return out;
	};
	const encode = text => {
		let out = "";
		for (const { segment } of graphemes.segment(text)) {
			if (!isThai(segment)) { out += segment; continue; }
			if ([...segment].length === 1) { thaiSingles.add(segment); out += segment; continue; }
			let ch = clusterToChar.get(segment);
			if (!ch) {
				ch = String.fromCodePoint(PUA_START + clusterToChar.size);
				clusterToChar.set(segment, ch);
			}
			out += ch;
		}
		return out;
	};

	self.BUILD_DEBUG = { encode, withBreaks, clusterToChar }; // for testing strings in game from DevTools

	// ---- 2) Apply translations
	const warnings = [];
	let applied = 0, mismatched = 0, jsReplaced = 0;
	const getAt = path => path.reduce((x, k) => x[k], P);
	const setAt = (path, v) => { const last = path[path.length - 1]; path.slice(0, -1).reduce((x, k) => x[k], P)[last] = v; };
	let jsOut = js;
	const encodedByCat = new Map(); // category -> [{id, text (encoded), thai}] for the wrap check
	const ivMap = new Map(); // English -> encoded Thai, for instance variables restored from savegames

	for (const e of strings) {
		const tr = translations.get(e.category + "|" + e.english);
		if (!tr) continue;
		// Names that must stay English (from the extractor's glossary).
		const row = tr;
		for (const term of (keepTerms.get(e.category + "|" + e.english) || "").split("|").map(s => s.trim()).filter(Boolean)) {
			if (term.endsWith("?")) continue;
			if (!row.thai.includes(term)) warnings.push(`${e.id}: keep term "${term}" missing in Thai`);
		}
		// Item descriptions: Thai lines are twice as tall as the English ones, so paragraph blank lines
		// are dropped there (the "---" separator lines stay).
		const thaiText = e.category === "item_desc" && Q.get("blank") !== "1" ? row.thai.replace(/\n[ \t]*\n+/g, "\n") : row.thai;
		const encoded = encode(withBreaks(thaiText));
		if (e.category !== "dialogue" && e.category !== "option" && encoded !== e.english) ivMap.set(e.english, encoded);
		(encodedByCat.get(e.category) || encodedByCat.set(e.category, []).get(e.category)).push({ id: e.id, text: encoded, thai: row.thai, english: e.english, category: e.category });
		for (const path of e.paths) {
			if (getAt(path) !== e.english) { ++mismatched; continue; }
			setAt(path, encoded);
			++applied;
		}
		if (e.literal) {
			const lit = JSON.stringify(e.english), rep = JSON.stringify(encoded);
			const parts = jsOut.split(lit);
			if (parts.length > 1) { jsReplaced += parts.length - 1; jsOut = parts.join(rep); }
			else warnings.push(`${e.id}: literal not found in c3main.js`);
		}
	}
	log(`applied ${applied} data.json values (${mismatched} skipped: game text changed), ${jsReplaced} c3main.js literals`);
	log(`Thai glyphs: ${thaiSingles.size} single chars + ${clusterToChar.size} clusters`);

	// ---- 3) Fonts: one new sheet per distinct original font
	const instancesByType = new Map();
	const walkLayers = layers => layers.forEach(ly => {
		(ly[14] || []).forEach(inst => { const t = T[inst[1]]; if (t && t[1] === 6) { (instancesByType.get(inst[1]) || instancesByType.set(inst[1], []).get(inst[1])).push(inst); } });
		if (Array.isArray(ly[21])) walkLayers(ly[21]);
	});
	P[5].forEach(l => walkLayers(l[10]));

	const thaiChars = [...thaiSingles, ...clusterToChar.keys()];
	const glyphFor = new Map([...thaiSingles].map(c => [c, c]));
	for (const [cluster, ch] of clusterToChar) glyphFor.set(ch, cluster);
	const newThaiCharset = ZWSP + [...thaiSingles].join("") + [...clusterToChar.values()].join("");

	const upscaleOf = new Map(); // patched SpriteFont type index -> K
	const grownBy = {}; // type name -> [height added, y moved] (first instance), stored in saves
	const fonts = new Map(); // key -> {file, ...}
	let fontIndex = 0;
	for (const [ti, insts] of instancesByType) {
		const t = T[ti];
		if (SKIP_TYPES.has(t[0]) || !t[6] || !t[6][0]) continue;
		const p = insts[0][5];
		const [cw, ch, charset, spacing, scale0, charSpacing] = [p[2], p[3], p[4], p[5], p[6], p[7]];
		if (insts.some(i => i[5][2] !== cw || i[5][3] !== ch || i[5][4] !== charset || i[5][5] !== spacing || i[5][6] !== scale0 || i[5][7] !== charSpacing)) {
			warnings.push(`${t[0]}: instances use different font settings - skipped`);
			continue;
		}
		const tuning = FONT_TUNING[t[0]] || null;
		const key = [t[6][0], t[6][2], t[6][3], t[6][4], t[6][5], cw, ch, charset, spacing, scale0, charSpacing, JSON.stringify(tuning)].join("|");
		let font = fonts.get(key);
		if (!font) {
			font = await makeFont({ image: t[6], cw, ch, charset, spacing, scale0, charSpacing, index: fontIndex++, thaiChars, glyphFor, newThaiCharset, tuning, lh0: p[8] || 0 });
			fonts.set(key, font);
			await HM.saveBuild(font.file, font.blob);
			const img = document.createElement("img");
			img.src = URL.createObjectURL(font.blob);
			img.title = `${font.file} (${t[0]} ...)`;
			document.getElementById("fonts").appendChild(img);
		}
		// Type image -> new sheet; instance props -> new cell size / charset / spacing / scale.
		t[6] = [font.file, font.blob.size, 0, 0, font.width, font.height, false];
		for (const inst of insts) {
			const q = inst[5], w = inst[0];
			const scale = q[6];
			q[2] = font.cell; q[3] = font.cell;
			q[4] = font.charset;
			q[5] = font.spacingData;
			q[6] = scale / font.upscale;
			q[7] = 0; // original character spacing is folded into the glyph widths
			q[8] = q[8] + font.extraLineHeight;
			// SpriteFont clips to its box: grow the box by the extra glyph height and move it up
			// by the baseline shift, so the text's top edge stays where it was.
			// world props: [x, y, z, width, height, angle, ?, color, originX, originY, ...]
			// props[9] = horizontal align (0 left, 1 center, 2 right), props[10] = vertical align.
			// A line only shows if the box is at least one line advance tall.
			// Objects with effects (the menu's ScanLines) clip SpriteFont text to the box, so
			// leave headroom - except stacked mouse targets, capped by HEIGHT_CAP (in the real game
			// 24px menu buttons / 16px choices show Thai unclipped).
			const lineH = Math.max(font.cell / font.upscale, ch * LINE_FACTOR) * 2.4;
			const h = w[4];
			const cap = HEIGHT_CAP[t[0]];
			const fixedH = HEIGHT_FIXED[t[0]];
			const grow = fixedH ? Math.max(0, fixedH - h) : Math.max(0, Math.min(Math.ceil((lineH - ch) * scale) + 2, cap ? cap - h : Infinity));
			const shift = font.dy * scale;
			const oy = typeof w[9] === "number" ? w[9] : 0;
			const y0 = w[1];
			w[4] = h + grow;
			const top = w[1] - oy * h;
			const newTop = (q[10] === 2 ? top - grow : q[10] === 1 ? top - grow / 2 - shift / 2 : top - shift) + font.moveDown;
			w[1] = newTop + oy * w[4];
			if (!grownBy[t[0]]) grownBy[t[0]] = [grow, w[1] - y0, h];
			// Thai runs longer than English: widen boxes that have free space to their side.
			const widen = WIDEN[t[0]];
			if (widen && q[9] === 0) {
				const ox = typeof w[8] === "number" ? w[8] : 0;
				const left = w[0] - ox * w[3];
				w[3] = w[3] * widen;
				w[0] = left + ox * w[3];
			}
		}
		font.types = (font.types || []).concat(t[0]);
		upscaleOf.set(ti, font.upscale);
		if (!font.saveInfo) font.saveInfo = {
			cs: font.charset, cw: font.cell, sd: font.spacingData, k: font.upscale, cw0: cw, ch0: ch, cs0: charset, sd0: spacing, csp0: charSpacing,
			lhx: font.extraLineHeight, lineH: Math.max(font.cell / font.upscale, ch * LINE_FACTOR) * 2.4, dy: font.dy, moveDown: font.moveDown
		};
	}
	log(`fonts: ${fonts.size} sheets for ${[...fonts.values()].reduce((n, f) => n + f.types.length, 0)} SpriteFont types`);

	// ---- 3b) Events that set a patched SpriteFont's scale (main menu hover: 1.1 / 1) would
	// undo the scale/K above, so their values are divided by K too.
	const tooLong = checkWrap(T, instancesByType, fonts, encodedByCat, warnings);
	await HM.save("too-long.csv", HM.toCsv(tooLong, ["id", "category", "box", "lines", "max_lines", "english", "thai"]));
	if (tooLong.length) log(`${tooLong.length} texts too long for their box -> work/too-long.csv (shorten the Thai to max_lines)`);
	jsOut = patchInstanceVars(jsOut, ivMap, warnings);
	jsOut += scrollRuntime(T, instancesByType, fonts, P, warnings);
	jsOut = patchScaleActions(P, jsOut, upscaleOf, warnings);
	jsOut = patchSaveLoad(jsOut, [...fonts.values()].map(f => Object.assign({ types: f.types }, f.saveInfo)), grownBy, warnings);

	// ---- 4) Save
	await HM.saveBuild("data.json", JSON.stringify(data));
	await HM.saveBuild("scripts/c3main.js", jsOut);
	await HM.save("build-report.txt", [
		`built ${new Date().toISOString()}`,
		`translations ${translations.size}, applied ${applied}, c3main literals ${jsReplaced}`,
		`clusters ${clusterToChar.size}`,
		...[...fonts.values()].map(f => `${f.file}: ${f.width}x${f.height} cell ${f.cell} <- ${f.types.join(", ")}`),
		"", "warnings:", ...warnings
	].join("\n"));
	log(`saved build/www/data.json, scripts/c3main.js, ${fonts.size} font sheets`);
	log(warnings.length ? `\n${warnings.length} warnings:\n` + warnings.slice(0, 40).join("\n") : "\nno warnings");
}

// Event sheet actions are [objectIndex, aceIndex, behavior, sid, ?, ?, params]; aceIndex points
// into the runtime's function table, 62 = SpriteFont "Set scale" in this build (checked in game:
// menu hover sets 1.1, leave sets 1). A number parameter is [0, [exprIndex]] into the
// expression table self.rwt in c3main.js, where constants look like ()=>1.1.
const ACE_SPRITEFONT_SET_SCALE = 62;

function patchScaleActions(P, js, upscaleOf, warnings) {
	const T = P[3];
	// A family can be patched when all its members got the same K.
	const kOf = new Map(upscaleOf);
	for (const [fam, ...members] of P[4]) {
		const ks = new Set(members.map(m => upscaleOf.get(m)));
		if (ks.size === 1 && !ks.has(undefined)) kOf.set(fam, [...ks][0]);
		else if ([...ks].some(k => k !== undefined) && T[members[0]] && T[members[0]][1] === 6) warnings.push(`family ${T[fam][0]}: members have mixed font patches - scale actions not adjusted`);
	}

	const table = parseExprTable(js);
	if (!table) { warnings.push("expression table self.rwt not found in c3main.js - scale actions not adjusted"); return js; }
	log(`expression table: ${table.entries.length} entries`);
	const added = [], addedIndex = new Map();
	const constIndex = value => {
		const src = `()=>${+value.toFixed(6)}`;
		if (!addedIndex.has(src)) { addedIndex.set(src, table.entries.length + added.length); added.push(src); }
		return addedIndex.get(src);
	};

	let patched = 0;
	const walk = x => {
		if (!Array.isArray(x)) return;
		if (x.length === 7 && x[1] === ACE_SPRITEFONT_SET_SCALE && x[2] === null && kOf.has(x[0]) && Array.isArray(x[6])) {
			const p = x[6][0], k = kOf.get(x[0]);
			const m = Array.isArray(p) && p[0] === 0 && Array.isArray(p[1]) && p[1].length === 1 && /^\(\)=>(-?[\d.]+(e-?\d+)?)$/.exec(table.entries[p[1][0]] || "");
			if (m) { p[1][0] = constIndex(+m[1] / k); ++patched; }
			else warnings.push(`${T[x[0]][0]}: Set scale with a non-constant value - not adjusted`);
			return;
		}
		x.forEach(walk);
	};
	P[6].forEach(walk);
	log(`scale actions adjusted: ${patched} (${added.join(", ")})`);
	if (!added.length) return js;
	return js.slice(0, table.end) + "," + added.join(",") + js.slice(table.end);
}

// Savegames store each SpriteFont's cell size, charset, spacing data, scale and line height
// (Spritefont2 SaveToJson/LoadFromJson: {cw, ch, cs, sd, csc, lh, ...}), and its box (x/y/w/h)
// separately, loaded before the font data. Loading a save made before the mod would put the
// original 10px font settings back onto the new sheet (Thai not in the charset -> no text).
// So:
//  - load: a patched font keeps the new sheet's settings; scale / line height from the save
//    are converted; a save made without the mod (no `thai` mark) also gets the box grown and
//    shifted exactly like build() does for the layout instances.
//  - save: a patched font is written in the original font's units (+ `thai: 1`), so the save
//    still loads correctly after uninstalling the mod.
// Minified names below are from this build's c3main.js (checked 2026-09-22):
//   sdk inst: RLt.b8t() = font settings (X8t cw, Z8t ch, Q8t charset, t6t spacing data)
//   uW() = world info (cI y, pI set y, dT height, Qg set height, Jj origin y, Cj bbox changed)
const SAVE_HOOK_FIND = "t.tw={st:this.F8t,en:this.H8t,l:this.U8t}),t}yI(t){if(this.V8t(),";
const SAVE_HOOK_REPLACE = "t.tw={st:this.F8t,en:this.H8t,l:this.U8t}),self.__thaiSave?self.__thaiSave(this,t):t}yI(t){t=self.__thaiLoad?self.__thaiLoad(this,t):t;if(this.V8t(),";

function patchSaveLoad(js, fontInfos, grownBy, warnings) {
	const parts = js.split(SAVE_HOOK_FIND);
	if (parts.length !== 2) { warnings.push(`SpriteFont save/load code not found (${parts.length - 1} matches) - old saves will show no Thai text`); return js; }
	log(`save/load hook: ${fontInfos.length} fonts`);
	const runtime = `
;(() => {
	const FONTS = ${JSON.stringify(fontInfos)};
	const CAPS = ${JSON.stringify(HEIGHT_CAP)};
	const FIXED = ${JSON.stringify(HEIGHT_FIXED)};
	const GROWN = ${JSON.stringify(grownBy)};
	// Several types can end up with identical new font settings from different originals, so
	// fonts are found by object type name (sdk inst -> pZ() instance -> iq() object class -> Bf() name).
	const byType = new Map();
	FONTS.forEach(f => f.types.forEach(n => byType.set(n, f)));
	const fontOf = inst => { try { return byType.get(inst.pZ().iq().Bf()); } catch (e) { return undefined; } };
	const VALIGN = { top: 0, center: 1, bottom: 2 };
	self.__thaiLoad = (inst, t) => {
		try {
			const font = inst.RLt.b8t(), f = fontOf(inst);
			if (!f || !t || font.X8t() !== f.cw || font.Q8t() !== f.cs) return t;
			if (t.cs === f.cs && t.cw === f.cw && t.sd === f.sd) return t;
			self.__thaiConverted = (self.__thaiConverted || 0) + 1; // debug: fonts converted from a save
			// Saved by an earlier build of this mod (no save hook): already in the new font's units.
			const modUnits = !t.thai && t.cw !== f.cw0;
			const scale0 = t.csc;
			const n = Object.assign({}, t, { cw: font.X8t(), ch: font.Z8t(), cs: font.Q8t(), sd: font.t6t(), csp: 0 });
			if (!modUnits) { n.csc = t.csc / f.k; n.lh = t.lh + f.lhx; }
			delete n.thai; delete n.gd;
			const wi = inst.uW();
			// A save made with the mod records how much its box was grown/moved (gd): undo that,
			// then grow again with this build's rules (sizes may have changed between builds).
			if (t.thai && Array.isArray(t.gd)) { wi.Qg(wi.dT() - t.gd[0]); wi.pI(wi.cI() - t.gd[1]); }
			// Saved by a mod build from before gd (2026-09-22 tests): its box size is unknown, so go back
			// to the type's original height around the same centre, then grow like an original save.
			const g0 = GROWN[inst.pZ().iq().Bf()];
			const noGd = t.thai && !Array.isArray(t.gd) && g0;
			if (noGd) { const oy0 = wi.Jj(), h1 = wi.dT(), c = wi.cI() - oy0 * h1 + h1 / 2; wi.Qg(g0[2]); wi.pI(c - g0[2] / 2 + oy0 * g0[2]); }
			if ((!t.thai || Array.isArray(t.gd) || noGd) && !modUnits) {
				const h = wi.dT(), oy = wi.Jj(), y = wi.cI();
				const va = typeof t.va === "string" ? VALIGN[t.va] : t.va;
				const cap = CAPS[inst.pZ().iq().Bf()], fixedH = FIXED[inst.pZ().iq().Bf()];
				const grow = fixedH ? Math.max(0, fixedH - h) : Math.max(0, Math.min(Math.ceil((f.lineH - f.ch0) * scale0) + 2, cap ? cap - h : Infinity)), shift = f.dy * scale0;
				const top = y - oy * h;
				const newTop = (va === 2 ? top - grow : va === 1 ? top - grow / 2 - shift / 2 : top - shift) + (f.moveDown || 0);
				wi.Qg(h + grow);
				wi.pI(newTop + oy * (h + grow));
				inst.__thaiGd = [grow, wi.cI() - y];
			}
			wi.Cj();
			return n;
		} catch (e) { console.error("[thai] load", e); return t; }
	};
	self.__thaiSave = (inst, t) => {
		try {
			const f = fontOf(inst);
			if (!f || t.cw !== f.cw || t.cs !== f.cs) return t;
			// gd: box growth of this instance (grown on load) or of the layout instances (grown by the build).
			const gd = inst.__thaiGd || GROWN[inst.pZ().iq().Bf()];
			return Object.assign({}, t, { cw: f.cw0, ch: f.ch0, cs: f.cs0, sd: f.sd0, csc: t.csc * f.k, csp: f.csp0, lh: t.lh - f.lhx, thai: 1 }, gd ? { gd } : {});
		} catch (e) { console.error("[thai] save", e); return t; }
	};
})();
`;
	return parts.join(SAVE_HOOK_REPLACE) + runtime;
}

// Word-wrap simulation for the dialogue box and choices: how many lines each translated text needs
// with the new font, vs how many fit in the box (maxLines: choices are stacked 16px apart, so one). SpriteFont wraps at whitespace (incl. U+200B) and does not
// draw lines below the box, so anything over capacity would be cut off in game.
// Line advance = cell * scale + lineHeight (lineHeight is not scaled - matches the in-game spacing).
const WRAP_CHECKS = [
	{ type: "ui_dialogue_textframe_text", categories: ["dialogue"] },
	{ type: "ui_dialogue_textframe_choice1", categories: ["option"], maxLines: 1 },
	{ type: "item_stext_description", categories: ["item_desc"], scrolls: true }
];

function checkWrap(T, instancesByType, fonts, encodedByCat, warnings) {
	const tooLong = [];
	for (const check of WRAP_CHECKS) checkWrapOne(check, T, instancesByType, fonts, encodedByCat, warnings, tooLong);
	return tooLong;
}

function checkWrapOne(WRAP_CHECK, T, instancesByType, fonts, encodedByCat, warnings, tooLong) {
	const ti = T.findIndex(t => t[0] === WRAP_CHECK.type);
	const inst = (instancesByType.get(ti) || [])[0];
	const font = [...fonts.values()].find(f => f.types.includes(WRAP_CHECK.type));
	if (!inst || !font) { warnings.push(`wrap check: ${WRAP_CHECK.type} not found`); return; }
	const q = inst[5], boxW = inst[0][3], boxH = inst[0][4], scale = q[6];
	const widths = new Map();
	for (const [w, chars] of JSON.parse(font.spacingData)) for (const c of chars) widths.set(c, w * scale);
	const cw = c => widths.has(c) ? widths.get(c) : font.cell * scale;
	const advance = font.cell * scale + q[8];
	const glyphH = font.cell * scale;
	if (WRAP_CHECK.scrolls) WRAP_CHECK.maxLines = 999; // long texts scroll in game: report only
	const capacity = WRAP_CHECK.maxLines || Math.max(1, Math.floor((boxH - glyphH) / advance) + 1);
	const linesOf = text => {
		text = text.replace(/\[\/?[a-z]+(=[^\]]*)?\]/gi, ""); // BBCode tags are not drawn
		let lines = 0;
		for (const para of text.split("\n")) {
			const tokens = para.match(/[ ​]+|[^ ​]+/g) || [""];
			let n = 1, x = 0;
			for (const tok of tokens) {
				const w = [...tok].reduce((s, c) => s + cw(c), 0);
				const space = /^[ ​]/.test(tok);
				if (x + w > boxW && x > 0 && !space) { ++n; x = w; }
				else if (!(space && x === 0)) x += w;
			}
			lines += n;
		}
		return lines;
	};
	const hist = new Map(), over = [];
	for (const cat of WRAP_CHECK.categories) for (const e of encodedByCat.get(cat) || []) {
		const n = linesOf(e.text);
		hist.set(n, (hist.get(n) || 0) + 1);
		if (n > capacity) { over.push(`${e.id} (${n} lines): ${e.thai}`); tooLong.push({ id: e.id, category: e.category, box: WRAP_CHECK.type, lines: n, max_lines: capacity, english: e.english, thai: e.thai }); }
	}
	log(`wrap check ${WRAP_CHECK.type}: box ${boxW}x${boxH}, line ${advance.toFixed(1)}px, fits ${capacity} lines; ` +
		[...hist].sort((a, b) => a[0] - b[0]).map(([n, c]) => `${n} lines: ${c}`).join(", ") + ` -> ${over.length} too long`);
	if (over.length <= 10) for (const o of over) warnings.push(`too long for ${WRAP_CHECK.type}: ` + o);
	else warnings.push(`${over.length} texts too long for ${WRAP_CHECK.type} - see work/too-long.csv`);
}

// Savegames also store every instance variable. Item descriptions etc. are instance variables, so
// items saved before the mod came back in English (seen in game 2026-09-22). Hooks in the engine's
// instance load/save: load maps an English string to the Thai text, save maps it back, so saves
// stay valid for the original game. Exact-match only; dialogue/options are not instance variables.
const IV_LOAD_FIND = "let n=e;null===n&&(n=NaN),this.KHt[i]=n";
const IV_LOAD_REPLACE = "let n=self.__thaiIvLoad?self.__thaiIvLoad(e):e;null===n&&(n=NaN),this.KHt[i]=n";
const IV_SAVE_FIND = "t[e[s].toString()]=this.KHt[s]";
const IV_SAVE_REPLACE = "t[e[s].toString()]=self.__thaiIvSave?self.__thaiIvSave(this.KHt[s]):this.KHt[s]";

function patchInstanceVars(js, ivMap, warnings) {
	const nLoad = js.split(IV_LOAD_FIND).length - 1, nSave = js.split(IV_SAVE_FIND).length - 1;
	if (nLoad !== 1 || nSave !== 1) { warnings.push(`instance variable save/load code not found (${nLoad}/${nSave}) - items from old saves stay English`); return js; }
	log(`instance variable hook: ${ivMap.size} strings`);
	return js.replace(IV_LOAD_FIND, IV_LOAD_REPLACE).replace(IV_SAVE_FIND, IV_SAVE_REPLACE) + `
;(() => {
	const toThai = new Map(${JSON.stringify([...ivMap])});
	const toEnglish = new Map([...toThai].map(([en, th]) => [th, en]));
	self.__thaiIvLoad = v => typeof v === "string" && toThai.has(v) ? toThai.get(v) : v;
	self.__thaiIvSave = v => typeof v === "string" && toEnglish.has(v) ? toEnglish.get(v) : v;
})();
`;
}

// Scrolling text boxes (SCROLL_BOXES). The game sets the whole text; each tick this code notices a new
// text, word-wraps it itself with the font's glyph widths (same rules as checkWrap: breaks at spaces
// and U+200B, "\n" = new line, BBCode tags have no width), and puts back only the lines that fit,
// starting at the scroll position. Colour tags that span the cut are closed / reopened so every slice
// is valid BBCode. ArrowUp / ArrowDown / PageUp / PageDown or the mouse wheel over the box scroll it;
// a 2px scrollbar is drawn in a DOM overlay over the canvas (UI layer coordinates = viewport coords).
// Uses the script API (runOnStartup, inst.text / isVisible / x / y / width / height) plus two minified
// names from this build: runtime.QH (= objects) and cls.BV() (= getAllInstances).
function scrollRuntime(T, instancesByType, fonts, P, warnings) {
	const boxes = [];
	for (const [type, opt] of Object.entries(SCROLL_BOXES)) {
		const ti = T.findIndex(t => t[0] === type);
		const inst = (instancesByType.get(ti) || [])[0];
		const font = [...fonts.values()].find(f => f.types.includes(type));
		if (!inst || !font) { warnings.push(`scroll box ${type} not found`); continue; }
		const scale = inst[5][6], widths = {};
		for (const [w, chars] of JSON.parse(font.spacingData)) for (const ch of chars) widths[ch] = w * scale;
		const cellH = font.cell * scale, advance = cellH + inst[5][8];
		const rows = Math.max(1, Math.floor((inst[0][4] - cellH) / advance) + 1);
		boxes.push({ type, widths, def: font.cell * scale, rows, barX: opt.barX });
	}
	if (!boxes.length) return "";
	log(`scroll boxes: ${boxes.map(b => `${b.type} (${b.rows} lines)`).join(", ")}`);
	return `
;(() => {
	const BOXES = ${JSON.stringify(boxes)};
	const VIEW_W = ${P[10]}, VIEW_H = ${P[11]};
	const TAG = /\\[(\\/?)([a-z]+)(=[^\\]]*)?\\]/gi;
	// -> [{text}] lines; a colour tag open across a line break is closed and reopened
	function wrap(box, text, maxW) {
		const lines = [];
		let open = "";
		for (const para of text.split("\\n")) {
			const toks = []; // {tag, close} | {s, w, sp}
			let i = 0;
			while (i < para.length) {
				TAG.lastIndex = i;
				const m = TAG.exec(para);
				if (m && m.index === i) { toks.push({ tag: m[0], close: !!m[1] }); i += m[0].length; continue; }
				const ch = para[i], sp = ch === " " || ch === "\\u200B", last = toks[toks.length - 1];
				const w = box.widths[ch] !== undefined ? box.widths[ch] : box.def;
				if (last && !last.tag && last.sp === sp) { last.s += ch; last.w += w; }
				else toks.push({ s: ch, w, sp });
				++i;
			}
			let cur = { text: open, w: 0 };
			const flush = () => { lines.push({ text: cur.text + (open ? "[/color]" : "") }); cur = { text: open, w: 0 }; };
			for (const t of toks) {
				if (t.tag) { cur.text += t.tag; open = t.close ? "" : t.tag; continue; }
				if (t.sp) { if (cur.w > 0) { cur.text += t.s; cur.w += t.w; } continue; }
				if (cur.w > 0 && cur.w + t.w > maxW) { cur.text = cur.text.replace(/[ \\u200B]+$/, ""); flush(); }
				cur.text += t.s; cur.w += t.w;
			}
			flush();
		}
		return lines;
	}
	self.runOnStartup(runtime => {
		const state = BOXES.map(() => ({ inst: null, full: null, shown: null, lines: [], scroll: 0 }));
		let bar = null;
		const canvasRect = () => { const c = document.querySelector("canvas"); return c ? c.getBoundingClientRect() : null; };
		function drawBar(box, st) {
			const inst = st.inst, over = inst && inst.isVisible && st.lines.length > box.rows;
			if (!bar) {
				bar = document.createElement("div");
				bar.style.cssText = "position:fixed;pointer-events:none;z-index:50;background:rgba(0,40,10,0.85)";
				bar.appendChild(document.createElement("div"));
				document.body.appendChild(bar);
			}
			if (!over) { bar.style.display = "none"; return; }
			const r = canvasRect(); if (!r) return;
			const sx = r.width / VIEW_W, sy = r.height / VIEW_H, h = inst.height;
			Object.assign(bar.style, { display: "block", left: (r.left + box.barX * sx) + "px", top: (r.top + inst.y * sy) + "px", width: Math.round(2 * sx) + "px", height: (h * sy) + "px" });
			const th = Math.max(8, h * box.rows / st.lines.length), ty = (h - th) * st.scroll / (st.lines.length - box.rows);
			Object.assign(bar.firstChild.style, { position: "absolute", left: "0", width: "100%", top: Math.round(ty) * sy + "px", height: Math.round(th) * sy + "px", background: "#24ff6d" });
		}
		function apply(k) {
			const box = BOXES[k], st = state[k];
			st.scroll = Math.max(0, Math.min(st.scroll, st.lines.length - box.rows));
			st.shown = st.lines.slice(st.scroll, st.scroll + box.rows).map(l => l.text).join("\\n");
			st.inst.text = st.shown;
			drawBar(box, st);
		}
		runtime.addEventListener("tick", () => BOXES.forEach((box, k) => {
			const st = state[k];
			try {
				if (!st.inst) {
					const objs = runtime.objects || runtime.QH;
					const cls = objs && Object.values(objs).find(c => c && c.name === box.type);
					const all = cls && (cls.getAllInstances ? cls.getAllInstances() : cls.BV());
					st.inst = (all && all[0]) || null;
					if (!st.inst) return;
				}
				const text = st.inst.text;
				if (text !== st.shown) {
					if (text !== st.full) { st.full = text; st.scroll = 0; st.lines = wrap(box, text, st.inst.width - 1); }
					if (st.lines.length > box.rows) apply(k); else st.shown = text;
				}
				drawBar(box, st);
			} catch (e) { console.error("[thai] scroll", e); }
		}));
		// Gamepad: right stick up / down (standard mapping axis 3). Held: one line per 150 ms, faster when
		// pushed all the way. Only while a box is visible and overflowing, like the keys.
		let padNext = 0;
		runtime.addEventListener("tick", () => {
			const pads = navigator.getGamepads ? navigator.getGamepads() : [];
			let y = 0;
			for (const p of pads) if (p && p.axes && Math.abs(p.axes[3] || 0) > Math.abs(y)) y = p.axes[3];
			if (Math.abs(y) < 0.5) { padNext = 0; return; }
			const now = performance.now();
			if (now < padNext) return;
			if (BOXES.map((b, k) => scrollBy(k, y > 0 ? 1 : -1)).some(Boolean)) padNext = now + (Math.abs(y) > 0.9 ? 80 : 150);
		});
		const scrollBy = (k, d) => {
			const st = state[k];
			if (!st.inst || !st.inst.isVisible || st.lines.length <= BOXES[k].rows) return false;
			st.scroll += d; apply(k); return true;
		};
		addEventListener("keydown", e => {
			const d = { ArrowDown: 1, ArrowUp: -1, PageDown: 5, PageUp: -5 }[e.key] || 0;
			if (d && BOXES.map((b, k) => scrollBy(k, d)).some(Boolean)) { e.preventDefault(); e.stopPropagation(); }
		}, true);
		addEventListener("wheel", e => {
			const r = canvasRect(); if (!r) return;
			const x = (e.clientX - r.left) * VIEW_W / r.width, y = (e.clientY - r.top) * VIEW_H / r.height;
			BOXES.forEach((b, k) => {
				const inst = state[k].inst;
				if (inst && inst.isVisible && x >= inst.x && x <= b.barX + 4 && y >= inst.y && y <= inst.y + inst.height) scrollBy(k, e.deltaY > 0 ? 2 : -2);
			});
		}, { passive: true, capture: true });
	});
})();
`;
}

// Finds `self.rwt=[ ... ]` and splits it into top-level entries (their source text).
function parseExprTable(js) {
	const start = js.indexOf("self.rwt=[");
	if (start < 0) return null;
	let i = start + "self.rwt=[".length, depth = 0, entryStart = i;
	const entries = [];
	for (; i < js.length; ++i) {
		const c = js[i];
		if (c === '"' || c === "'" || c === "`") {
			for (++i; i < js.length && js[i] !== c; ++i) if (js[i] === "\\") ++i;
			continue;
		}
		if (c === "(" || c === "[" || c === "{") ++depth;
		else if (c === ")" || c === "}" || (c === "]" && depth > 0)) --depth;
		else if (c === "]") { entries.push(js.slice(entryStart, i)); return { entries, end: i }; }
		else if (c === "," && depth === 0) { entries.push(js.slice(entryStart, i)); entryStart = i + 1; }
	}
	return null;
}

// Bitsy font (.bitsyfont text): "CHAR <codepoint>", optional "CHAR_SIZE w h" (w = advance),
// "CHAR_OFFSET x y" (in half pixels: bitsy draws text at 2x), "CHAR_SPACING n" (advance, overrides w),
// then one "0101..." row per pixel line. Thai marks have spacing 0 and a negative x offset so they
// land on the previous consonant.
const bitsyCache = new Map();
// grow: rows added to every consonant / vowel body (6 rows in Thai_nuttatulipa). Pixel fonts can't be
// scaled by a ratio without breaking the letters (Thai_7x7 / Thai_4x5 were made that way and were
// unreadable in game), so a row is duplicated where the glyph is straight: a row equal to its
// neighbour, else a row made only of vertical strokes. Everything above it moves up; the baseline stays.
async function loadBitsy(url, grow = 0, tight = 0) {
	const key = url + "|" + grow + "|" + tight;
	if (bitsyCache.has(key)) return bitsyCache.get(key);
	const text = await fetch(url).then(r => { if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.text(); });
	const glyphs = new Map();
	let cur = null;
	for (const line of text.split(/\r?\n/)) {
		let m;
		if ((m = /^CHAR (\d+)$/.exec(line))) { cur = { w: 0, ox: 0, oy: 0, sp: null, rows: [] }; glyphs.set(+m[1], cur); }
		else if (!cur) continue;
		else if ((m = /^CHAR_SIZE (\d+) (\d+)$/.exec(line))) cur.w = +m[1];
		else if ((m = /^CHAR_OFFSET (-?\d+) (-?\d+)$/.exec(line))) { cur.ox = Math.round(+m[1] / 2); cur.oy = Math.round(+m[2] / 2); }
		else if ((m = /^CHAR_SPACING (-?\d+)$/.exec(line))) cur.sp = +m[1];
		else if (/^[01]+$/.test(line)) cur.rows.push(line);
	}
	const ko = glyphs.get(0xE01);
	const base = ko.rows.reduce((b, row, r) => row.includes("1") ? r + ko.oy : b, 0);
	const bodyTop = ko.rows.findIndex(row => row.includes("1")) + ko.oy;
	for (let g = 0; g < grow; ++g) for (const [cp, gl] of glyphs)
		if (cp >= 0xE01 && cp <= 0xE5B && !isBitsyMark(cp) && gl.oy === 0) growGlyph(gl, bodyTop - g, base);
	let top = Infinity, bottom = -Infinity;
	for (const [cp, gl] of glyphs) if (cp >= 0xE01 && cp <= 0xE5B) gl.rows.forEach((row, r) => {
		if (!row.includes("1")) return;
		const y = r + gl.oy + bitsyRowShift(cp, r + gl.oy, true, base, grow, tight);
		top = Math.min(top, y); bottom = Math.max(bottom, y);
	});
	const font = { glyphs, top, bottom, base, grow, tight };
	bitsyCache.set(key, font);
	return font;
}

function growGlyph(gl, bodyTop, base) {
	const rows = gl.rows;
	const on = (r, x) => r >= 0 && r < rows.length && rows[r][x] === "1";
	const mid = (bodyTop + base) / 2;
	let best = null;
	for (let r = bodyTop + 1; r < base; ++r) {
		if (!rows[r].includes("1")) continue;
		const same = rows[r] === rows[r + 1] || rows[r] === rows[r - 1];
		const vertical = [...rows[r]].every((p, x) => p === "0" || (on(r - 1, x) && on(r + 1, x)));
		if (!same && !vertical) continue;
		const score = (same ? 0 : 10) + Math.abs(r - mid);
		if (!best || score < best.score) best = { r, score };
	}
	const r = best ? best.r : Math.round(mid);
	if (rows[0].includes("1")) throw new Error("bitsy glyph uses its top row - cannot grow");
	gl.rows = rows.slice(1, r + 1).concat(rows.slice(r)); // row r twice; rows above move up 1
}

// Marks (zero advance) are positioned, not grown.
const isBitsyMark = cp => BITSY_UPPER.has(cp) || BITSY_TONES.has(cp) || BITSY_LOWER.has(cp);

// Row shift for a pixel of a Thai glyph (row after CHAR_OFFSET), like a Thai font's mark positioning:
// the font leaves 3-row gaps around the 6-row body; marks are moved to 1-row gaps. With a grown body
// (grow rows taller) the upper marks move up again by grow. Lower marks stay under the baseline.
const BITSY_UPPER = new Set([0xE31, 0xE34, 0xE35, 0xE36, 0xE37, 0xE47, 0xE4D, 0xE4E]);
const BITSY_TONES = new Set([0xE48, 0xE49, 0xE4A, 0xE4B, 0xE4C]); // + thanthakhat, placed like a tone
// Consonants with a tall right stroke: marks over them move 2 px left (as in Thai fonts), else a
// lowered tone mark merges into the stroke.
const BITSY_TALL = new Set([0xE1B, 0xE1D, 0xE1F, 0xE2C]);
const BITSY_LOWER = new Set([0xE38, 0xE39, 0xE3A]);
// tight (dense boxes like item descriptions): tone marks sit directly on the upper vowel and lower
// vowels directly under the body -> 14-row cell instead of 16, so lines can be 14 apart.
function bitsyRowShift(cp, row, hasUpperVowel, base, grow = 0, tight = 0) {
	const t = tight ? 1 : 0;
	if (BITSY_LOWER.has(cp)) return -2 - t;
	if (BITSY_UPPER.has(cp)) return 2 - grow;
	if (cp === 0xE4C) return (hasUpperVowel ? 0 + t : 2) - grow;
	if (BITSY_TONES.has(cp)) return (hasUpperVowel ? 2 + t : 4) - grow;
	if (cp === 0xE33 && row < base - 5 - grow) return 2; // the circle of ำ (the า part stays)
	return 0;
}

// Draws a grapheme cluster; returns its advance in font pixels.
function drawBitsy(ctx, font, text, px, baseline) {
	const cps = [...text].map(c => c.codePointAt(0)).filter(cp => font.glyphs.has(cp));
	const hasUpperVowel = cps.some(cp => BITSY_UPPER.has(cp) || cp === 0xE33);
	const tall = BITSY_TALL.has(cps[0]);
	const pad = Math.max(0, ...cps.slice(0, 1).map(cp => -font.glyphs.get(cp).ox)); // a lone mark would start left of the cell
	let x = pad;
	for (const cp of cps) {
		const gl = font.glyphs.get(cp);
		const dx = tall && (BITSY_UPPER.has(cp) || BITSY_TONES.has(cp)) ? -2 : 0;
		gl.rows.forEach((row, r) => {
			const y = r + gl.oy + bitsyRowShift(cp, r + gl.oy, hasUpperVowel, font.base, font.grow, font.tight);
			for (let k = 0; k < row.length; ++k) if (row[k] === "1")
				ctx.fillRect((x + gl.ox + dx + k) * px, baseline - (font.base + 1 - y) * px, px, px);
		});
		x += gl.sp !== null ? gl.sp : gl.w;
	}
	return x;
}
async function loadImage(url) {
	const img = new Image();
	img.src = url;
	await img.decode();
	return img;
}

// Build a font sheet: original glyphs (scaled to the new cell) + Thai glyphs.
async function makeFont({ image, cw, ch, charset, spacing, scale0, charSpacing, index, thaiChars, glyphFor, newThaiCharset, tuning, lh0 }) {
	const [path, , sx, sy, sw] = image;
	const src = await loadImage("/game/" + path);
	const origChars = [...charset];
	const srcCols = Math.floor(sw / cw);

	// Cap height / baseline of the original font, measured on "A" (or the first glyph).
	const probe = document.createElement("canvas");
	probe.width = cw; probe.height = ch;
	const pg = probe.getContext("2d", { willReadFrequently: true });
	const ai = Math.max(0, origChars.indexOf("A"));
	pg.drawImage(src, sx + (ai % srcCols) * cw, sy + Math.floor(ai / srcCols) * ch, cw, ch, 0, 0, cw, ch);
	const pd = pg.getImageData(0, 0, cw, ch).data;
	let capTop = ch, capBottom = 0;
	for (let y = 0; y < ch; ++y) for (let x = 0; x < cw; ++x) if (pd[(y * cw + x) * 4 + 3] > 100) { capTop = Math.min(capTop, y); capBottom = Math.max(capBottom, y); }
	if (capTop > capBottom) { capTop = 0; capBottom = ch - 1; }
	const capH = capBottom - capTop + 1;

	// Upscale K: glyphs are drawn K times bigger and the SpriteFont scale divided by K, so
	// English looks the same while Thai gets K times the pixels (7px fonts -> x3).
	const upscale = cw <= 8 ? 3 : 2;
	// Thai consonant bodies are ~0.52 of the font size: match them to the English cap height,
	// leave room above for vowels / tone marks and below for ุ ู.
	// Bitsy pixel font (tuning.bitsy): each font pixel becomes tuning.px sheet pixels (px = K -> one
	// game pixel), the body's bottom row sits on the baseline, marks keep their CHAR_OFFSET places.
	const bitsy = tuning && tuning.bitsy ? await loadBitsy(tuning.bitsy, tuning.grow || 0, tuning.tight || 0) : null;
	const bpx = bitsy ? tuning.px : 0;
	const fontPx = bitsy ? bpx : Math.round(capH * upscale * (tuning ? tuning.size : THAI_SIZE));
	// Glyph cells must not be taller than the line advance: where a cell reaches into the line above,
	// the next line's marks there are not drawn (tested in game). So bitsy cells are cropped to the
	// font's exact vertical extent.
	const baseline = bitsy ? (bitsy.base + 1 - bitsy.top) * bpx : Math.round(fontPx * 0.98);
	const cell = Math.max(Math.max(cw, ch) * upscale, bitsy ? (bitsy.bottom - bitsy.top + 1) * bpx : Math.round(fontPx * 1.24));
	const asciiDy = baseline - (capBottom + 1) * upscale; // align English baseline with Thai
	const all = origChars.concat([...newThaiCharset]);
	const cols = 32, rows = Math.ceil(all.length / cols);
	const canvas = document.createElement("canvas");
	canvas.width = cols * cell;
	canvas.height = rows * cell;
	const g = canvas.getContext("2d");
	g.imageSmoothingEnabled = false;

	// Original glyphs + their widths
	const widths = new Map();
	// Spacing data is [[width, "chars"], ...]; one font in the game has a single un-nested pair.
	let pairs = [];
	try { pairs = spacing ? JSON.parse(spacing) : []; } catch (e) { pairs = []; }
	if (pairs.length && typeof pairs[0] === "number") pairs = [pairs];
	for (const [w, chars] of pairs) for (const c of String(chars)) widths.set(c, w);
	let color = [255, 255, 255];
	origChars.forEach((c, i) => {
		const gx = (i % srcCols) * cw, gy = Math.floor(i / srcCols) * ch;
		g.drawImage(src, sx + gx, sy + gy, cw, ch, (i % cols) * cell, Math.floor(i / cols) * cell + asciiDy, cw * upscale, ch * upscale);
	});
	// Glyph colours of the original font, so Thai matches: fill = most common bright colour,
	// outline = most common dark colour when the font has an outline/shadow (e.g. the
	// dialogue choice font).
	let outline = null;
	{
		const rowsUsed = Math.ceil(origChars.length / cols);
		const d = g.getImageData(0, 0, canvas.width, Math.max(1, rowsUsed) * cell).data;
		const bright = new Map(), dark = new Map();
		let opaque = 0;
		for (let i = 0; i < d.length; i += 4) {
			if (d[i + 3] < 200) continue;
			++opaque;
			const key = `${d[i]},${d[i + 1]},${d[i + 2]}`;
			const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
			const m = lum >= 128 ? bright : lum < 80 ? dark : null;
			if (m) m.set(key, (m.get(key) || 0) + 1);
		}
		const top = m => [...m].sort((a, b) => b[1] - a[1])[0];
		const b = top(bright), k = top(dark);
		if (b) color = b[0].split(",").map(Number);
		if (k && opaque && k[1] / opaque > 0.15) outline = k[0].split(",").map(Number);
	}
	// A few dense information panels need more contrast than their source
	// SpriteFont supplies.  A tuning override is opt-in, so all other fonts
	// continue to reproduce the game's original palette.
	if (tuning && tuning.color) color = tuning.color;
	if (tuning && tuning.outline) outline = tuning.outline;

	// Thai glyphs, 1-bit (alpha threshold) for a pixel look, or anti-aliased (tuning.smooth)
	const tmp = document.createElement("canvas");
	tmp.width = cell * 2; tmp.height = cell;
	const tg = tmp.getContext("2d", { willReadFrequently: true });
	const thaiWidths = new Map();
	[...newThaiCharset].forEach((c, k) => {
		const i = origChars.length + k;
		if (c === ZWSP) { thaiWidths.set(c, 0); return; }
		const text = glyphFor.get(c);
		tg.clearRect(0, 0, tmp.width, tmp.height);
		tg.fillStyle = "#fff";
		let bitsyAdvance = 0;
		if (bitsy) bitsyAdvance = drawBitsy(tg, bitsy, text, bpx, baseline) * bpx;
		else {
			const family = tuning && tuning.font ? tuning.font : THAI_FONT;
			const weight = tuning && tuning.weight ? `${tuning.weight} ` : "";
			tg.font = `${weight}${fontPx}px ${family}`;
			tg.textBaseline = "alphabetic";
			tg.fillText(text, 1, baseline);
		}
		const d = tg.getImageData(0, 0, tmp.width, tmp.height);
		const W = tmp.width, H = tmp.height;
		const mask = new Uint8Array(W * H);
		let maxX = 0;
		const smooth = tuning && tuning.smooth;
		for (let i = 0; i < W * H; ++i) mask[i] = d.data[i * 4 + 3] > (smooth ? 0 : 110) ? 1 : 0;
		// Outline ring: pixels within K px of the glyph (the original outline is 1 source px).
		const ring = new Uint8Array(W * H);
		if (outline) {
			const r = bitsy ? bpx : upscale; // pixel font: one font pixel (= one game pixel)
			for (let y = 0; y < H; ++y) for (let x = 0; x < W; ++x) {
				if (mask[y * W + x]) continue;
				search: for (let dy = -r; dy <= r; ++dy) for (let dx = -r; dx <= r; ++dx) {
					const xx = x + dx, yy = y + dy;
					if (xx >= 0 && yy >= 0 && xx < W && yy < H && mask[yy * W + xx]) { ring[y * W + x] = 1; break search; }
				}
			}
		}
		for (let i = 0; i < W * H; ++i) {
			const c = mask[i] ? color : ring[i] ? outline : null;
			d.data[i * 4 + 0] = c ? c[0] : 0;
			d.data[i * 4 + 1] = c ? c[1] : 0;
			d.data[i * 4 + 2] = c ? c[2] : 0;
			d.data[i * 4 + 3] = !c ? 0 : mask[i] && smooth ? d.data[i * 4 + 3] : ring[i] && smooth ? 176 : 255;
			if (c && (i % W) > maxX) maxX = i % W;
		}
		tg.putImageData(d, 0, 0);
		g.drawImage(tmp, 0, 0, cell, cell, (i % cols) * cell, Math.floor(i / cols) * cell, cell, cell);
		if (bitsy) { thaiWidths.set(c, Math.min(cell, bitsyAdvance)); return; }
		const advance = Math.ceil(tg.measureText(text).width) + 1;
		thaiWidths.set(c, Math.min(cell, Math.max(advance, maxX + 2)));
	});

	// Spacing data: [[width, "chars"], ...] in cell pixels
	const groups = new Map();
	const addW = (c, w) => { const k = Math.round(w); groups.set(k, (groups.get(k) || "") + c); };
	// Original advance was width*scale + charSpacing; with charSpacing forced to 0 and scale/K
	// the same advance is width*K + charSpacing*K/scale. Thai glyph widths are already tight.
	const spacingCells = (charSpacing || 0) * upscale / (scale0 || 1);
	for (const c of origChars) addW(c, Math.max(1, (widths.has(c) ? widths.get(c) : cw) * upscale + spacingCells));
	// Characters with a width but no glyph (the space is not in most charsets).
	for (const [c, w] of widths) if (!origChars.includes(c)) addW(c, Math.max(1, w * upscale + spacingCells));
	// No width for the space: SpriteFont would use the whole cell (16+ game px with the Thai cell),
	// so give it the original font's default advance (cell width + character spacing).
	if (!widths.has(" ") && !origChars.includes(" ")) addW(" ", Math.max(1, cw * upscale + spacingCells));
	// Bitsy advances already include the letter gap.
	for (const [c, w] of thaiWidths) addW(c, c === ZWSP ? 0 : w + (bitsy ? 0 : Math.max(1, Math.round(upscale / 2))));
	const spacingData = JSON.stringify([...groups].map(([w, chars]) => [w, chars]));

	const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
	return {
		file: `images/thai-font-${index}.png`, blob, width: canvas.width, height: canvas.height,
		cell, upscale, charset: all.join(""), spacingData,
		// Keep each glyph cell no taller than its line advance. For smooth fonts,
		// tuning.line is the desired advance as a multiple of the Thai em size;
		// pixel fonts keep their authored game-pixel line advance.
		extraLineHeight: (() => {
			const target = bitsy
				? Math.max(tuning.line * upscale, cell)
				: Math.max(fontPx * (tuning ? tuning.line : LINE_FACTOR), cell + upscale);
			return Math.round(target / upscale - cell / upscale - (tuning ? lh0 : 0));
		})(),
		// Text now starts asciiDy/K lower: callers can compensate.
		dy: asciiDy / upscale,
		// Extra layout px to move the text box down (tuning.moveDown; whole pixels keep pixel fonts sharp).
		// Dialogue pixel font: text sat ~5px above the frame centre; 3 keeps 3-line text inside the frame (measured in game).
		moveDown: (tuning && tuning.moveDown) || 0
	};
}

document.getElementById("run").onclick = () => build().catch(e => log("ERROR " + e.stack));
// #auto (used by the installer): run, then write work/build-done.txt = "OK" or "ERROR ..." + the log.
if (location.hash === "#auto") build().then(() => "OK", e => (log("ERROR " + e.stack), "ERROR " + e.message))
	.then(status => HM.save("build-done.txt", status + "\n" + document.getElementById("log").textContent));
</script>
